name: Deploy to Firebase

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Decode Secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          fi

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      # --- Desplegament de Regles de Firestore ---
      - name: Deploy Firestore Rules
        if: hashFiles('firestore.rules') != ''
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LLOM }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx --yes firebase-tools@latest deploy \
              --only firestore:rules \
              --project ${{ vars.FIREBASE_PROJECT_ID || 'llom-23d56' }} \
              --non-interactive
            rm -f "$RUNNER_TEMP/firebase-sa.json"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release per a tauleta/mòbil)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Web (Release)
        run: flutter build web --release --no-tree-shake-icons

      - name: Prepare Hosting Artifacts
        run: |
          # Copia l'APK generat a la carpeta pública del hosting web
          cp build/app/outputs/flutter-apk/app-release.apk build/web/llom.apk
          
          # Extreu la versió de l'etiqueta Git (ex: v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          if [[ "$GITHUB_REF" != "refs/tags/"* ]]; then
            VERSION="latest"
          fi
          
          echo "Generant version.json per a la versió: $VERSION"
          
          PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID || 'llom-23d56' }}"
          echo "{\"version\": \"$VERSION\", \"apkUrl\": \"https://${PROJECT_ID}.web.app/llom.apk\"}" > build/web/version.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LLOM }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID || 'llom-23d56' }}
